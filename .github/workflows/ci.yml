name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Offline requirement: nothing in the built bundle may reference a font/script CDN.
      - name: Bundle has no CDN references
        run: |
          if grep -rEi 'fonts[.]googleapis|fonts[.]gstatic|cdnjs[.]|cdn[.]jsdelivr|unpkg[.]com' dist; then
            echo "CDN reference found in the built bundle"
            exit 1
          fi

  # Builds both images and drives a real analyze cycle through the running stack. This is
  # the only place the container definitions are exercised automatically.
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack and wait for both healthchecks
        run: docker compose up --build --wait --wait-timeout 180
      - name: Backend is healthy and the database is migrated
        run: curl -fsS http://127.0.0.1:8000/v1/health | tee /dev/stderr | grep -q '"status":"ok"'
      - name: Frontend serves the app and falls back to index.html for a client route
        run: |
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/results/sq-00000000 | grep -q '<div id="root">'
      - name: Full analyze cycle through the API
        run: |
          python3 - <<'PY'
          import base64
          open("scene.png", "wb").write(base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="))
          PY
          curl -fsS -F "query=Describe the land-cover and major objects visible in this image." \
            -F "files=@scene.png;filename=Cartosat2S_Scene_Bhopal.png" \
            http://127.0.0.1:8000/v1/analyze > result.json
          python3 -c "import json; r = json.load(open('result.json')); assert not r['rejected'] and r['evidence']['boxes'], r"
      - name: Session survives a backend restart (the data volume persists)
        run: |
          SESSION=$(python3 -c "import json; print(json.load(open('result.json'))['sessionId'])")
          docker compose restart backend
          docker compose up --wait --wait-timeout 120
          curl -fsS "http://127.0.0.1:8000/v1/session/$SESSION" > /dev/null
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
