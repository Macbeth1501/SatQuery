server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: /results/<sessionId> is a client route, so a reload or a shared link
    # must fall back to index.html instead of 404ing.
    location / {
        try_files $uri /index.html;
    }

    # Vite fingerprints everything under /assets/, so it can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
